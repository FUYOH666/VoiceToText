# VTTv2 — profile: resident (always-on model)
#
# Snapshot of the pre-idle-unload setup: model stays loaded after login/warmup
# until the STT process exits. Use when you want zero cold-start on every dictate.
#
# Activate:
#   cp config.resident.yaml config.yaml
#   uv run python src/vtt2/main.py --install
#
# Active daily default is config.yaml (idle_unload). See docs/STT_API.md.

app:
  version: "1.4.0"
  name: "VTTv2"

stt_server:
  host: "127.0.0.1"
  port: 8765
  max_upload_mb: 25
  request_timeout_seconds: 600
  engine: mlx_whisper
  # Always keep weights in GPU/unified memory
  preload_on_start: true
  idle_unload_seconds: 0

transcription:
  engine: local_stt
  local_stt:
    base_url: "http://127.0.0.1:8765"
    path: "/v1/audio/transcriptions"
    timeout_seconds: 600
    warmup_wait_seconds: 180
  mlx_whisper:
    model_name: "mlx-community/whisper-large-v3-mlx"
    language: "ru"
    temperature: 0.0
    beam_size: 5
    best_of: 5
    no_speech_threshold: 0.6
    compression_ratio_threshold: 2.4
    chunk_size_seconds: 30
    chunk_overlap_seconds: 2
    batch_size: 6
  whisper_cpp:
    binary_path: "./whisper.cpp/build/bin/whisper-cli"
    model_path: "./models/ggml-medium-q5_0.bin"
    use_coreml: false
    use_metal: true
    threads: 4
    language: "ru"
    temperature: 0.0
    beam_size: 5
    best_of: 5
    patience: 1.0
    no_speech_threshold: 0.6
    compression_ratio_threshold: 2.4
  remote_asr:
    host: "YOUR_TAILSCALE_IP"
    port: 8001
    path: "/v1/audio/transcriptions"
    model: "cstr/whisper-large-v3-turbo-int8_float32"
    timeout_seconds: 60

audio:
  sample_rate: 16000
  channels: 1
  device_index: null
  chunk_size: 1024
  max_recording_duration: 7200

ui:
  auto_paste_enabled: true
  auto_paste_method: cgevent
  hotkey: "option+space"

menu_bar:
  icon_idle: "🎤"
  icon_recording: "🔴"
  show_status: true

text_processing:
  enabled: false
  strip_whisper_tail_artifacts: true
  whisper_artifact_languages:
    - ru
    - en

performance:
  use_neural_engine: true
  max_concurrent_tasks: 1
  memory_limit_mb: 16384
  auto_cleanup_enabled: true
  cleanup_threshold_percent: 75
  periodic_cleanup_interval: 10

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s %(message)s"
  file: null
