name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Mac VTT2
        - Linux F9
        - Docs / onboarding
        - Enterprise / private ASR
        - Other
