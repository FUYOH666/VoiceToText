    <rect x="106.5" y="53.1" width="7" height="13.8" rx="3.5" fill="#F97316"/>
  </g>
  <!-- wordmark -->
  <text x="236" y="150" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#1F2328" letter-spacing="-1.5">VoiceToText</text>
  <text x="238" y="196" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#59636E">Free, private voice typing for Apple Silicon Macs.</text>
  <text x="238" y="232" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#59636E">Local models · one-command install · nothing leaves your Mac</text>
  <!-- key cap + flow -->
  <g transform="translate(922 82)">
    <rect x="0" y="0" width="300" height="196" rx="18" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
    <g transform="translate(28 30)">
      <rect width="74" height="58" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
      <text x="37" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2328">⌥</text>
      <rect x="86" width="158" height="58" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
      <text x="165" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1F2328">Space</text>
    </g>
    <text x="150" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#59636E">hold · speak · let go</text>
    <g transform="translate(28 142)">
      <rect width="244" height="34" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
      <text x="12" y="23" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1F2328">Ship the installer today</text>
      <rect x="218" y="8" width="2.5" height="18" fill="#F97316"/>
    </g>
