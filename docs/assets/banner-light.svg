<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="VoiceToText — free, private voice typing for Apple Silicon Macs">
  <rect width="1280" height="360" rx="24" fill="#FFFFFF"/>
  <!-- app mark -->
  <g transform="translate(88 92)">
    <rect width="120" height="120" rx="30" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
    <rect x="14.5" y="54.2" width="7" height="11.5" rx="3.5" fill="#F97316"/>
    <rect x="26.0" y="47.4" width="7" height="25.3" rx="3.5" fill="#F97316"/>
    <rect x="37.5" y="38.2" width="7" height="43.7" rx="3.5" fill="#F97316"/>
    <rect x="49.0" y="45.0" width="7" height="29.9" rx="3.5" fill="#F97316"/>
    <rect x="60.5" y="29.0" width="7" height="62.1" rx="3.5" fill="#F97316"/>
    <rect x="72.0" y="42.8" width="7" height="34.5" rx="3.5" fill="#F97316"/>
    <rect x="83.5" y="34.7" width="7" height="50.6" rx="3.5" fill="#F97316"/>
