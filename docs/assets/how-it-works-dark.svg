<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="How it works: hold Option+Space, speak, let go and the text is pasted at your cursor">
  
  <g transform="translate(0 26)">
    <rect width="380" height="248" rx="18" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <circle cx="34" cy="34" r="15" fill="#F97316"/>
    <text x="34" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="60" y="41" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F0F6FC">Hold ⌥ Space</text>
    <g transform="translate(64 92)">
      <rect width="88" height="70" rx="14" fill="#21262D" stroke="#30363D" stroke-width="2"/>
      <text x="44" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#F0F6FC">⌥</text>
      <rect x="102" width="150" height="70" rx="14" fill="#21262D" stroke="#F97316" stroke-width="3"/>
      <text x="177" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F0F6FC">Space</text>
    </g>
    <text x="190.0" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9DA7B3">hold to talk · or tap to start and stop</text>
  </g>
  
  <g transform="translate(450 26)">
    <rect width="380" height="248" rx="18" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <circle cx="34" cy="34" r="15" fill="#F97316"/>
    <text x="34" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="60" y="41" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F0F6FC">Speak</text>
    <rect x="64" y="121.0" width="10" height="12" rx="5" fill="#F97316" opacity="0.64"/>
    <rect x="86" y="114.0" width="10" height="26" rx="5" fill="#F97316" opacity="0.74"/>
    <rect x="108" y="105.0" width="10" height="44" rx="5" fill="#F97316" opacity="0.87"/>
    <rect x="130" y="112.0" width="10" height="30" rx="5" fill="#F97316" opacity="0.77"/>
    <rect x="152" y="96.0" width="10" height="62" rx="5" fill="#F97316" opacity="1.00"/>
    <rect x="174" y="109.0" width="10" height="36" rx="5" fill="#F97316" opacity="0.81"/>
    <rect x="196" y="101.0" width="10" height="52" rx="5" fill="#F97316" opacity="0.93"/>
    <rect x="218" y="115.0" width="10" height="24" rx="5" fill="#F97316" opacity="0.72"/>
    <rect x="240" y="107.0" width="10" height="40" rx="5" fill="#F97316" opacity="0.84"/>
    <rect x="262" y="118.0" width="10" height="18" rx="5" fill="#F97316" opacity="0.68"/>
    <rect x="284" y="112.0" width="10" height="30" rx="5" fill="#F97316" opacity="0.77"/>
    <rect x="306" y="120.0" width="10" height="14" rx="5" fill="#F97316" opacity="0.65"/>
    <text x="190.0" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9DA7B3">Russian, English and many more</text>
  </g>
  
  <g transform="translate(900 26)">
    <rect width="380" height="248" rx="18" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <circle cx="34" cy="34" r="15" fill="#F97316"/>
    <text x="34" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="60" y="41" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F0F6FC">Let go</text>
    <g transform="translate(28 72)">
      <rect width="324" height="112" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="5" fill="#FF5F57"/><circle cx="34" cy="16" r="5" fill="#FEBC2E"/><circle cx="50" cy="16" r="5" fill="#28C840"/>
      <text x="18" y="52" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#E6EDF3">Ship the installer today,</text>
      <text x="18" y="76" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#E6EDF3">then record the demo video.</text>
      <rect x="262" y="62" width="2.5" height="18" fill="#F97316"/>
    </g>
    <text x="190.0" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9DA7B3">pasted at your cursor, in any app</text>
  </g>
  <path d="M396 150 h38" stroke="#484F58" stroke-width="3" stroke-linecap="round"/><path d="M426 141 l9 9 l-9 9" fill="none" stroke="#484F58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M846 150 h38" stroke="#484F58" stroke-width="3" stroke-linecap="round"/><path d="M876 141 l9 9 l-9 9" fill="none" stroke="#484F58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
