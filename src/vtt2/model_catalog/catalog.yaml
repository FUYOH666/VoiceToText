# Curated speech-to-text models for the model picker (GET /v1/models).
#
# Quantized variants first: they are plenty for everyday dictation and let Macs
# with less memory run the tool. download_gb is the weights download; ram_gb is
# the approximate resident memory while loaded. On Apple Silicon that is unified
# memory shared with macOS and your apps (on a GPU box it would be VRAM).
# min_memory_gb: below this much installed RAM the model is marked as not fitting.
# verified_revision: the Hugging Face commit checked when the entry was added.
#
# Families: qwen3_asr (mlx-qwen3-asr) and mlx_whisper (mlx-whisper).

# First rule whose min_memory_gb <= installed RAM picks the recommended model.
recommended:
  - min_memory_gb: 16
    model: qwen3-asr-1.7b-8bit
  - min_memory_gb: 0
    model: qwen3-asr-0.6b-8bit

models:
  - id: qwen3-asr-1.7b-8bit
    title: "Qwen3-ASR 1.7B · 8-bit"
    family: qwen3_asr
    repo: moona3k/mlx-qwen3-asr-1.7b-8bit
    verified_revision: 22c8abe6a6772122dda5905967d7496d1d3e8dd2
    quantization: 8bit
    download_gb: 2.17
    ram_gb: 2.7
    min_memory_gb: 8
    languages: "30 языков, включая русский и английский"
    note: "Лучший баланс для русского с английскими терминами, с пунктуацией"

