# VTTv2 Configuration

app:
  version: "1.2.9"
  name: "VTTv2"

# ⭐ Движок транскрипции
transcription:
  # remote_asr — когда GPU ASR снова в сети; сейчас — локальный MLX
  engine: mlx_whisper  # mlx_whisper | whisper_cpp | remote_asr
  mlx_whisper:
    # Модель MLX (автоматически скачивается при первом использовании)
    # Доступные модели: mlx-community/whisper-tiny-mlx, whisper-small-mlx, whisper-medium-mlx, whisper-large-v3-mlx
    model_name: "mlx-community/whisper-large-v3-mlx"  # Оптимально для M4 Max с 128GB RAM - максимальное качество
    language: "auto"  # "auto" для автоопределения языка, или код языка: "ru", "en", "zh" (китайский), "ja" (японский) и т.д.
    temperature: 0.0
    beam_size: 5
    best_of: 5
    no_speech_threshold: 0.6
    compression_ratio_threshold: 2.4
    # Параметры для обработки длинных записей (15-45 минут)
    chunk_size_seconds: 30  # Размер чанка для обработки (секунды)
    chunk_overlap_seconds: 2  # Перекрытие между чанками для плавного соединения текста
    batch_size: 6  # Размер батча для параллельной обработки (оптимально для large-v3 на M4 Max)
  whisper_cpp:
    # Путь к бинарнику whisper (относительно проекта или абсолютный)
    # Только для fallback - MLX Whisper используется по умолчанию
    binary_path: "./whisper.cpp/build/bin/whisper-cli"
    # Путь к модели (Medium Q5_0 квантизация - оптимально для M1 с 8GB RAM)
    model_path: "./models/ggml-medium-q5_0.bin"
    # ⭐ Core ML для M1 (Neural Engine) - опционально для whisper.cpp fallback
    # Metal GPU ускорение работает и без Core ML
    use_coreml: false
    # ⭐ Metal для GPU ускорения
    use_metal: true
    # Количество потоков (4 для M1 - оптимально для баланса производительности и памяти)
    threads: 4
    # Язык
    language: "ru"
    # Параметры качества
    temperature: 0.0
    beam_size: 5
    best_of: 5
    patience: 1.0
    # Дополнительные параметры
    no_speech_threshold: 0.6
    compression_ratio_threshold: 2.4
  # Удалённый ASR — разгружает MacBook, транскрипция на Linux GPU (Tailscale)
  remote_asr:
    host: "YOUR_TAILSCALE_IP"  # Укажите Tailscale IP или задайте VTT2_TRANSCRIPTION_REMOTE_ASR_HOST
    port: 8001
    path: "/v1/audio/transcriptions"
    model: "cstr/whisper-large-v3-turbo-int8_float32"
    timeout_seconds: 60

# Аудио
audio:
  sample_rate: 16000
  channels: 1
  device_index: null  # null = default microphone
  chunk_size: 1024
  max_recording_duration: 7200  # 2 часа (поддержка длинных записей 15-45 минут и более)

# UI и управление
ui:
  auto_paste_enabled: true
  auto_paste_method: cgevent  # cgevent или clipboard
  hotkey: "option+space"      # Option+Space для toggle

menu_bar:
  icon_idle: "🎤"
  icon_recording: "🔴"
  show_status: true

# Постобработка текста (опционально)
text_processing:
  enabled: false
  strip_whisper_tail_artifacts: true  # хвостовые «субтитры», продолжение следует и т.п.
  whisper_artifact_languages:
    - ru
    - en

# Производительность
performance:
  use_neural_engine: true
  max_concurrent_tasks: 1
  memory_limit_mb: 16384  # 16GB для M4 Max (128GB RAM) - достаточно для large-v3 и длинных записей
  # Автоматическая очистка памяти для долгой работы (24/7)
  auto_cleanup_enabled: true  # Автоматическая очистка при превышении порога памяти
  cleanup_threshold_percent: 75  # Порог для запуска очистки (75% от лимита)
  periodic_cleanup_interval: 10  # Очистка памяти каждые N транскрипций

# Логирование
logging:
  level: INFO  # INFO для нормальной работы, DEBUG для диагностики (или --verbose)
  format: "%(asctime)s %(levelname)s %(name)s %(message)s"
  file: null  # null = ~/Library/Logs/vtt2/vtt2.log (default); "" = disable file logging

